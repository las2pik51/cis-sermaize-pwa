<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>CIS SERMAIZE Connect</title>

  <link
    rel="manifest"
    href="./manifest.json"
  >

  <link
    rel="apple-touch-icon"
    href="https://raw.githubusercontent.com/las2pik51/cis-sermaize-icone/main/icone-cis-sermaize-512.png"
  >

  <meta
    name="theme-color"
    content="#ffffff"
  >
</head>

<body>

  <h1>🚒 CIS SERMAIZE Connect</h1>

  <p>
    PWA de test
  </p>

  <p>
    Si cette page s'affiche, la première étape fonctionne.
  </p>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker
          .register('./service-worker.js')
          .then(function(registration) {
            console.log(
              'CIS SERMAIZE - Service Worker enregistré',
              registration
            );
          })
          .catch(function(error) {
            console.error(
              'CIS SERMAIZE - Erreur Service Worker',
              error
            );
          });
      });
    }
  </script>

</body>

</html>
